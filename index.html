<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Library</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <h1>My Library</h1>
      <button class="new-book-btn">+ New Book</button>
    </header>

    <main class="library">
      <div class="library-header">
        <h2>My Books</h2>
        <p class="book-count">0 books</p>
      </div>

      <section class="book-grid">
        <!-- Your JS will generate book cards here -->
      </section>
    </main>

    <!-- Modal -->

    <dialog class="book-dialog">
      <form class="book-form">
        <div class="form-header">
          <div>
            <h2>Add a new book</h2>
            <p>Enter the details of your book.</p>
          </div>

          <button type="button" class="close-dialog">×</button>
        </div>

        <div class="form-group">
          <label for="title">Title</label>
          <input
            type="text"
            id="title"
            name="title"
            placeholder="The Hobbit"
            required
          />
        </div>

        <div class="form-group">
          <label for="author">Author</label>
          <input
            type="text"
            id="author"
            name="author"
            placeholder="J.R.R. Tolkien"
            required
          />
        </div>

        <div class="form-group">
          <label for="pages">Pages</label>
          <input
            type="number"
            id="pages"
            name="pages"
            placeholder="295"
            min="1"
            required
          />
        </div>

        <label class="checkbox">
          <input type="checkbox" name="read" />
          <span>I've read this book</span>
        </label>

        <button type="submit" class="submit-book">Add Book</button>
      </form>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
